# Plantilla de la Container App. La completa desplegar_containerapps.ps1:
# no editar los __MARCADORES__ ni subir a Git una copia con los valores reales.
#
# Una sola replica con tres contenedores que comparten localhost:
#   proxy (nginx, unico expuesto, HTTPS lo pone Azure) -> web (Streamlit) y api (FastAPI).
# La base de datos es un Azure Database for MySQL (servidor flexible) aparte: los datos
# y las cuentas se conservan al detener, reiniciar o publicar una version nueva.
# El data lake (volumen EmptyDir) se regenera en cada arranque a partir de la BD.
location: __REGION__
name: __APP__
type: Microsoft.App/containerApps
properties:
  managedEnvironmentId: __ENV_ID__
  configuration:
    activeRevisionsMode: Single
    ingress:
      external: true
      targetPort: 80
      transport: auto
      allowInsecure: false
    registries:
      - server: __ACR__
        username: __ACR_USUARIO__
        passwordSecretRef: acr-password
    secrets:
      - {name: acr-password, value: "__ACR_PASSWORD__"}
      - {name: db-password, value: "__DB_PASSWORD__"}
      - {name: jwt-secreto, value: "__JWT__"}
      - {name: clave-cifrado, value: "__FERNET__"}
      - {name: llm-api-key, value: "__LLM_KEY__"}
  template:
    scale:
      minReplicas: 1
      maxReplicas: 1
    volumes:
      - {name: datalake, storageType: EmptyDir}
    containers:
      - name: web
        image: __ACR__/carro-paro-ia:__TAG__
        command: ["sh", "despliegue/azure/arranque.sh", "web"]
        resources: {cpu: 1.25, memory: 2.5Gi}
        env:
          - {name: DB_HOST, value: "__DB_HOST__"}
          - {name: DB_PORT, value: "3306"}
          - {name: DB_USER, value: "__DB_USER__"}
          - {name: DB_PASSWORD, secretRef: db-password}
          - {name: DB_NAME, value: carro_paro_db}
          - {name: ENTORNO, value: produccion}
          - {name: JWT_SECRETO, secretRef: jwt-secreto}
          - {name: CLAVE_CIFRADO, secretRef: clave-cifrado}
          - {name: MOTOR_BIGDATA, value: pandas}
          - {name: AGENTE_PROVEEDOR, value: "__AGENTE_PROVEEDOR__"}
          - {name: LLM_URL, value: "__LLM_URL__"}
          - {name: LLM_MODELO, value: "__LLM_MODELO__"}
          - {name: LLM_API_KEY, secretRef: llm-api-key}
          - {name: LLM_TIMEOUT, value: "60"}
          - {name: REGISTRO_ABIERTO, value: "true"}
          - {name: CORREO_MODO, value: archivo}
          - {name: MS_REDIRECT_URI, value: "https://__FQDN__"}
          - {name: PYTHONUNBUFFERED, value: "1"}
        volumeMounts:
          - {volumeName: datalake, mountPath: /app/data}
      - name: api
        image: __ACR__/carro-paro-ia:__TAG__
        command: ["sh", "despliegue/azure/arranque.sh", "api"]
        resources: {cpu: 0.5, memory: 1Gi}
        env:
          - {name: DB_HOST, value: "__DB_HOST__"}
          - {name: DB_PORT, value: "3306"}
          - {name: DB_USER, value: "__DB_USER__"}
          - {name: DB_PASSWORD, secretRef: db-password}
          - {name: DB_NAME, value: carro_paro_db}
          - {name: ENTORNO, value: produccion}
          - {name: JWT_SECRETO, secretRef: jwt-secreto}
          - {name: CLAVE_CIFRADO, secretRef: clave-cifrado}
          - {name: MOTOR_BIGDATA, value: pandas}
          - {name: AGENTE_PROVEEDOR, value: "__AGENTE_PROVEEDOR__"}
          - {name: LLM_URL, value: "__LLM_URL__"}
          - {name: LLM_MODELO, value: "__LLM_MODELO__"}
          - {name: LLM_API_KEY, secretRef: llm-api-key}
          - {name: LLM_TIMEOUT, value: "60"}
          - {name: REGISTRO_ABIERTO, value: "true"}
          - {name: CORREO_MODO, value: archivo}
          - {name: MS_REDIRECT_URI, value: "https://__FQDN__"}
          - {name: PYTHONUNBUFFERED, value: "1"}
        volumeMounts:
          - {volumeName: datalake, mountPath: /app/data}
      - name: proxy
        image: __ACR__/carro-paro-nginx:__TAG__
        resources: {cpu: 0.25, memory: 0.5Gi}
