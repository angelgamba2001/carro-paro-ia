# Proxy inverso delante de Streamlit: añade las cabeceras de seguridad que
# Streamlit no permite configurar (hallazgos de OWASP ZAP).
# Los escaneos de ZAP deben apuntar a este proxy (puerto 8501), no al contenedor web.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 8501;
    server_tokens off;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' blob:; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "microphone=(self), camera=(self), geolocation=(), payment=()" always;
    add_header Cache-Control "no-store, max-age=0" always;  # ZAP: directiva de cache explicita
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # DNS interno de Docker: nginx vuelve a resolver «web» cada pocos segundos. Sin esto guarda la IP
    # del arranque y, si el contenedor web se recrea, responde 502 hasta reiniciar el proxy.
    resolver 127.0.0.11 valid=5s ipv6=off;

    location / {
        set $destino http://web:8501;
        proxy_pass $destino;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;      # con puerto: Streamlit compara Host y Origin al abrir el WebSocket
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        client_max_body_size 10m;
    }
}
