# Levanta todo el sistema:   docker compose up --build
#   Web:  http://localhost:8501     API: http://localhost:8000/docs
# La primera vez el servicio "inicializador" crea la BD, genera el histórico y ejecuta el pipeline.
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-carro_paro_local}
    ports: ["3307:3306"]
    volumes: [mysql_datos:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-carro_paro_local}"]
      interval: 5s
      retries: 30

  inicializador:
    build: .
    env_file: .env
    environment: &entorno
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-carro_paro_local}
    depends_on: {mysql: {condition: service_healthy}}
    volumes: [datalake:/app/data]
    command: >
      sh -c "python scripts/inicializar_bd.py --sin-cambio &&
             python scripts/generar_historico.py --anios 5 &&
             python scripts/ejecutar_pipeline.py"

  web:
    build: .
    env_file: .env
    environment: *entorno
    depends_on: {inicializador: {condition: service_completed_successfully}}
    volumes: [datalake:/app/data]
    ports: ["8501:8501"]
    command: streamlit run app/main.py --server.address 0.0.0.0 --server.port 8501

  api:
    build: .
    env_file: .env
    environment: *entorno
    depends_on: {inicializador: {condition: service_completed_successfully}}
    volumes: [datalake:/app/data]
    ports: ["8000:8000"]
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000

volumes:
  mysql_datos:
  datalake:
